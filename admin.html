<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Olga Morlang – Admin</title><style>
:root{--bg:#101b35;--panel:#18294a;--gold:#e6c27a;--line:#405071;--text:#f7f0e4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}main{max-width:1200px;margin:auto;padding:22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}h1,h2{font-family:Georgia,serif;font-weight:normal}h1{color:var(--gold)}label{display:grid;gap:6px;margin:10px 0}input,textarea,select{padding:11px;border-radius:8px;border:1px solid var(--line);background:#101b35;color:white;width:100%}button{background:var(--gold);color:#182039;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:bold;margin:4px 4px 4px 0}.secondary{background:#293b5c;color:white;border:1px solid var(--line)}.hidden{display:none!important}.tabs{display:flex;flex-wrap:wrap;gap:5px}.msg{white-space:pre-wrap;color:#ffe0a0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}td{min-width:110px}.small{font-size:12px;color:#c9d4e8}.badge{display:inline-block;border:1px solid var(--gold);border-radius:20px;padding:4px 8px;color:var(--gold);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}img.thumb{width:100px;max-height:100px;object-fit:contain}.actions{display:flex;gap:5px;flex-wrap:wrap}
</style></head><body><main><h1>Olga Morlang · Adminbereich</h1><p class="small">Nur für autorisierte Administratoren. Diese Seite nicht im öffentlichen Menü verlinken.</p>
<section id="login" class="card"><h2>Anmelden</h2><form id="loginForm"><label>E-Mail<input id="email" type="email" required autocomplete="username"></label><label>Passwort<input id="password" type="password" required autocomplete="current-password"></label><button>Anmelden</button></form><p id="loginMsg" class="msg"></p></section>
<div id="dashboard" class="hidden"><div class="card"><div class="tabs"><button data-tab="orders">Bestellungen</button><button data-tab="artworks">Gemälde</button><button data-tab="categories">Kategorien</button><button id="logout" class="secondary">Abmelden</button></div><p id="status" class="msg"></p></div>
<section id="orders" class="card"><h2>Bestellungen & individuelle Anfragen</h2><button id="reloadOrders" class="secondary">Aktualisieren</button><div id="ordersList"></div></section>
<section id="artworks" class="card hidden"><h2>Gemälde</h2><form id="artForm"><input id="artId" type="hidden"><div class="grid"><label>Titel<input id="artTitle" required></label><label>Preis (€)<input id="artPrice" type="number" min="0" step="0.01"></label><label>Kategorie<select id="artCategory"></select></label><label>Bilddatei<input id="artFile" type="file" accept="image/*"></label><label>Breite (cm)<input id="artWidth" type="number" min="0"></label><label>Höhe (cm)<input id="artHeight" type="number" min="0"></label></div><label>Beschreibung<textarea id="artDescription"></textarea></label><label><span><input id="artPublished" type="checkbox" style="width:auto"> Öffentlich anzeigen</span></label><button>Gemälde speichern</button><button type="button" id="artReset" class="secondary">Formular leeren</button></form><div id="artList"></div></section>
<section id="categories" class="card hidden"><h2>Kategorien</h2><form id="catForm"><label>Name<input id="catName" required></label><button>Kategorie hinzufügen</button></form><div id="catList"></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://lcjtsyxeklltyoxovvzr.supabase.co';const SUPABASE_KEY='sb_publishable_Z5y2_ni_klXhEFU7I-OljA_JZcsyCVJ';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let categories=[];const $=id=>document.getElementById(id);function say(t){$('status').textContent=t}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(v){return v==null?'—':new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(v)||0)}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginMsg').textContent='Anmeldung läuft …';const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginMsg').textContent=error.message;return}await init()});async function init(){const {data:{user}}=await db.auth.getUser();if(!user){$('login').classList.remove('hidden');$('dashboard').classList.add('hidden');return}const {data:allowed,error}=await db.rpc('is_admin');if(error||allowed!==true){$('loginMsg').textContent='Dieses Konto ist nicht als Administrator freigeschaltet.';await db.auth.signOut();return}$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');await loadCategories();await loadOrders();await loadArtworks()}
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('#dashboard>section').forEach(s=>s.classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden')});
async function loadOrders(){const box=$('ordersList');box.innerHTML='Lade …';const {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false});if(error){box.textContent='Fehler beim Laden: '+error.message;return}if(!data?.length){box.textContent='Noch keine Bestellungen.';return}box.innerHTML='<div class="tablewrap"><table><thead><tr><th>Datum / Typ</th><th>Kunde</th><th>Details</th><th>Betrag</th><th>Status</th><th>Aktion</th></tr></thead><tbody>'+data.map(o=>{const custom=o.order_type==='custom';let details=custom?`<b>Individuelle Anfrage</b><br>${esc(o.custom_description||'—')}<br>Größe: ${esc(o.custom_size||'—')}<br>Budget: ${money(o.custom_budget)}<br>${o.reference_image_path?'<span class="small">Referenzbild hinterlegt</span>':''}`:(Array.isArray(o.items)?o.items.map(i=>esc(i.title||i.name||i.artwork_title||'Gemälde')).join('<br>'):esc(JSON.stringify(o.items||[])));return `<tr><td>${esc(new Date(o.created_at).toLocaleString('de-DE'))}<br><span class="badge">${custom?'Individuell':'Gemälde'}</span></td><td>${esc(o.buyer_name||'—')}<br>${esc(o.buyer_email||'—')}<br><span class="small">${esc([o.buyer_city,o.buyer_country].filter(Boolean).join(', '))}</span></td><td>${details}<br><span class="small">${esc(o.buyer_comment||'')}</span></td><td>${custom?'—':money(o.total)}</td><td><select id="st-${esc(o.id)}"><option ${o.status==='new'?'selected':''} value="new">Neu</option><option ${o.status==='pending'?'selected':''} value="pending">In Bearbeitung</option><option ${o.status==='confirmed'?'selected':''} value="confirmed">Bestätigt</option><option ${o.status==='shipped'?'selected':''} value="shipped">Versendet</option><option ${o.status==='completed'?'selected':''} value="completed">Abgeschlossen</option><option ${o.status==='cancelled'?'selected':''} value="cancelled">Storniert</option></select></td><td><button onclick="saveStatus('${String(o.id).replace(/'/g,'')}','${custom?'custom':'artwork'}')">Speichern</button>${custom&&o.reference_image_path?`<button class="secondary" onclick="viewReference('${esc(o.reference_image_path)}')">Referenzbild</button>`:''}</td></tr>`}).join('')+'</tbody></table></div>'}
window.saveStatus=async(id,type)=>{const status=$('st-'+id).value;const {error}=await db.from('orders').update({status}).eq('id',id);say(error?'Status konnte nicht gespeichert werden: '+error.message:'Status gespeichert.');if(!error)loadOrders()};window.viewReference=async(path)=>{const {data,error}=await db.storage.from('custom-references').createSignedUrl(path,300);if(error){say('Bild konnte nicht geöffnet werden: '+error.message);return}window.open(data.signedUrl,'_blank','noopener')};$('reloadOrders').onclick=loadOrders;
async function loadCategories(){const {data,error}=await db.from('categories').select('*').order('name');if(error){say('Kategorien: '+error.message);return}categories=data||[];$('artCategory').innerHTML=categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');$('catList').innerHTML=categories.map(c=>`<p>${esc(c.name)} <button class="secondary" onclick="deleteCategory('${String(c.id).replace(/'/g,'')}')">Löschen</button></p>`).join('')||'Noch keine Kategorien.'} $('catForm').onsubmit=async e=>{e.preventDefault();const {error}=await db.from('categories').insert({name:$('catName').value.trim()});if(error){say(error.message);return}$('catName').value='';await loadCategories();say('Kategorie hinzugefügt.')};window.deleteCategory=async id=>{if(!confirm('Kategorie löschen?'))return;const {error}=await db.from('categories').delete().eq('id',id);say(error?error.message:'Kategorie gelöscht.');await loadCategories()};
async function loadArtworks(){const {data,error}=await db.from('artworks').select('*').order('created_at',{ascending:false});if(error){$('artList').textContent='Fehler: '+error.message;return}$('artList').innerHTML=(data||[]).map(a=>`<div class="card"><img class="thumb" src="${esc(a.image_url||'')}" alt=""><b>${esc(a.title)}</b> · ${money(a.price)} · ${a.published?'öffentlich':'Entwurf'}<div>${esc(a.description||'')}</div><div class="actions"><button onclick="editArt('${String(a.id).replace(/'/g,'')}')">Bearbeiten</button><button class="secondary" onclick="toggleArt('${String(a.id).replace(/'/g,'')}',${!a.published})">${a.published?'Verbergen':'Veröffentlichen'}</button><button class="secondary" onclick="deleteArt('${String(a.id).replace(/'/g,'')}')">Löschen</button></div></div>`).join('')||'Noch keine Gemälde.'}
window.editArt=async id=>{const {data,error}=await db.from('artworks').select('*').eq('id',id).single();if(error){say(error.message);return}$('artId').value=data.id;$('artTitle').value=data.title||'';$('artPrice').value=data.price??'';$('artCategory').value=data.category_id||'';$('artWidth').value=data.width_cm??'';$('artHeight').value=data.height_cm??'';$('artDescription').value=data.description||'';$('artPublished').checked=!!data.published;window.scrollTo({top:0,behavior:'smooth'})};window.toggleArt=async(id,published)=>{const {error}=await db.from('artworks').update({published}).eq('id',id);say(error?error.message:'Sichtbarkeit geändert.');loadArtworks()};window.deleteArt=async id=>{if(!confirm('Gemälde wirklich löschen?'))return;const {error}=await db.from('artworks').delete().eq('id',id);say(error?error.message:'Gemälde gelöscht.');loadArtworks()};$('artReset').onclick=()=>{$('artForm').reset();$('artId').value=''};$('artForm').onsubmit=async e=>{e.preventDefault();say('Speichere …');let image_url=null;const file=$('artFile').files[0];if(file){const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=Date.now()+'-'+crypto.randomUUID()+'-'+safe;const up=await db.storage.from('artworks').upload(path,file,{upsert:false});if(up.error){say('Upload fehlgeschlagen: '+up.error.message);return}image_url=db.storage.from('artworks').getPublicUrl(path).data.publicUrl}else if($('artId').value){const old=await db.from('artworks').select('image_url').eq('id',$('artId').value).single();image_url=old.data?.image_url}if(!image_url){say('Bitte ein Bild auswählen.');return}const row={title:$('artTitle').value.trim(),price:$('artPrice').value===''?null:Number($('artPrice').value),category_id:$('artCategory').value||null,width_cm:$('artWidth').value===''?null:Number($('artWidth').value),height_cm:$('artHeight').value===''?null:Number($('artHeight').value),description:$('artDescription').value,published:$('artPublished').checked,image_url};const id=$('artId').value;const result=id?await db.from('artworks').update(row).eq('id',id):await db.from('artworks').insert(row);if(result.error){say('Speichern fehlgeschlagen: '+result.error.message);return}$('artForm').reset();$('artId').value='';say('Gemälde gespeichert.');await loadArtworks()};db.auth.onAuthStateChange((_event,session)=>{if(session)init()});init();
</script></body></html>
